<!DOCTYPE html>
<html>
<head>
  <title>Jarvis AI Command Center</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1100px;
      margin: auto;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; margin: 0 0 4px 0; font-size: 24px; }
    h2 { color: #94a3b8; font-size: 16px; margin: 0 0 12px 0; font-weight: normal; }
    h3 { color: #38bdf8; font-size: 14px; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 1px; }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    textarea {
      flex: 1;
      height: 80px;
      font-size: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #475569;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #38bdf8; }
    .btn {
      padding: 10px 20px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #475569; cursor: not-allowed; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-success { background: #16a34a; color: white; }
    .btn-success:hover { background: #15803d; }
    .btn-warning { background: #d97706; color: white; }
    .btn-warning:hover { background: #b45309; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #475569; }
    .btn-ghost:hover { background: #334155; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    .mode-select {
      padding: 8px 12px;
      border-radius: 6px;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #475569;
      font-size: 14px;
    }
    #voice-btn {
      background: #16a34a;
      color: white;
      cursor: pointer;
    }
    #voice-btn.recording { background: #dc2626; }
    #voice-status { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .quick-btns button {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .quick-btns button:hover { background: #475569; }

    /* Task Queue */
    .task-list { display: flex; flex-direction: column; gap: 6px; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #0f172a;
      border-radius: 8px;
      border-left: 4px solid #475569;
      font-size: 14px;
    }
    .task-item.queued { border-left-color: #6366f1; }
    .task-item.interpreting { border-left-color: #f59e0b; }
    .task-item.waiting_for_confirmation { border-left-color: #f97316; }
    .task-item.running { border-left-color: #22c55e; }
    .task-item.completed { border-left-color: #16a34a; opacity: 0.8; }
    .task-item.partially_completed { border-left-color: #84cc16; opacity: 0.8; }
    .task-item.failed { border-left-color: #ef4444; }
    .task-item.cancelled { border-left-color: #6b7280; opacity: 0.6; }
    .task-id { color: #64748b; font-size: 11px; font-family: monospace; min-width: 80px; }
    .task-input { flex: 1; color: #e2e8f0; }
    .task-input .original { color: #94a3b8; }
    .task-input .interpreted { color: #22c55e; font-size: 13px; margin-top: 2px; }
    .task-status {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-queued { background: #312e81; color: #a5b4fc; }
    .status-interpreting { background: #78350f; color: #fcd34d; }
    .status-waiting_for_confirmation { background: #7c2d12; color: #fdba74; }
    .status-running { background: #14532d; color: #86efac; }
    .status-completed { background: #14532d; color: #86efac; }
    .status-partially_completed { background: #3f6212; color: #bef264; }
    .status-failed { background: #7f1d1d; color: #fca5a5; }
    .status-cancelled { background: #1f2937; color: #9ca3af; }
    .task-actions { display: flex; gap: 4px; }
    .task-result {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      max-height: 60px;
      overflow-y: auto;
    }
    .task-result pre { margin: 0; font-size: 11px; color: #64748b; }

    /* Confirmation Dialog */
    .confirm-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .confirm-dialog {
      background: #1e293b;
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      border: 1px solid #475569;
    }
    .confirm-dialog h3 { color: #f97316; margin: 0 0 12px 0; }
    .confirm-dialog p { color: #cbd5e1; margin: 0 0 16px 0; line-height: 1.5; }
    .confirm-dialog .actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* Response area */
    #response-area {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      min-height: 60px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
    }
    #response-area .entry { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #1e293b; }
    #response-area .entry:last-child { border-bottom: none; }
    #response-area .entry .label { color: #64748b; font-size: 12px; }
    #response-area .entry .original { color: #e2e8f0; }
    #response-area .entry .understood { color: #22c55e; font-size: 13px; }
    #response-area .entry .reply { color: #38bdf8; }
    #response-area .entry .error { color: #f87171; }

    .hidden { display: none; }
    .mt-8 { margin-top: 8px; }
    .mb-8 { margin-bottom: 8px; }
    .flex { display: flex; }
    .gap-8 { gap: 8px; }
    .items-center { align-items: center; }
    body { background:#050505; color:#f4f4f5; padding:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .sidebar { position:fixed; inset:0 auto 0 0; width:220px; background:#0b0b0b; border-right:1px solid #262626; padding:22px 14px; z-index:30; }
    .brand { color:#d4af37; font-weight:800; font-size:18px; padding:8px 10px 20px; }
    .nav-btn { display:block; width:100%; text-align:left; padding:11px 12px; margin:3px 0; border:0; border-radius:10px; background:transparent; color:#d4d4d4; cursor:pointer; }
    .nav-btn:hover,.nav-btn.active { background:#1b1b1b; color:#f4cf63; }
    .command-header { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .monitor-live { float:right; margin-top:-42px; display:flex; align-items:center; gap:9px; padding:8px 12px; border:1px solid #4a3d16; border-radius:999px; background:#111; color:#f4cf63; font-size:12px; cursor:pointer; }
    .monitor-live.hidden { display:none; }
    .monitor-live.paused { color:#d4d4d4; border-color:#525252; }
    .monitor-orbit { position:relative; width:17px; height:17px; border:1px solid currentColor; border-radius:50%; box-shadow:inset 0 0 0 4px #111; }
    .monitor-orbit::before { content:""; position:absolute; inset:4px; border:1px solid currentColor; border-radius:50%; opacity:.5; }
    .monitor-orbit::after { content:""; position:absolute; width:5px; height:5px; top:-2px; left:6px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; transform-origin:2px 10px; animation:monitorSpin 1.4s linear infinite; }
    .monitor-live.paused .monitor-orbit::after { animation-play-state:paused; }
    @keyframes monitorSpin { to { transform:rotate(360deg); } }
    .container { max-width:980px; margin-left:220px; padding:32px 28px 150px; }
    .card { background:transparent; border:0; border-radius:0; padding:0; margin-bottom:28px; }
    .card:first-child { position:sticky; bottom:18px; z-index:20; background:#18181b; border:1px solid #3f3f46; border-radius:24px; padding:18px; box-shadow:0 18px 60px rgba(0,0,0,.45); }
    h1 { color:#fafafa; font-size:20px; letter-spacing:-.02em; }
    h2 { color:#a1a1aa; font-size:13px; }
    h3 { color:#a1a1aa; font-size:12px; }
    textarea { min-height:72px; height:auto; background:transparent; border:0; color:#fafafa; padding:10px 4px; line-height:1.55; }
    textarea:focus { border:0; box-shadow:none; }
    .btn { border-radius:999px; }
    .btn-primary { background:#d4af37; color:#090909; }
    .btn-primary:hover { background:#d4d4d8; }
    .quick-btns button,.mode-select,.btn-ghost { background:#27272a; border:1px solid #3f3f46; color:#d4d4d8; border-radius:999px; }
    #response-area { background:transparent; max-height:none; padding:0; font-size:15px; }
    #response-area .entry { max-width:82%; background:#18181b; border:1px solid #27272a; border-radius:18px; padding:14px 16px; margin:0 0 12px auto; }
    #response-area .entry .reply { color:#f4f4f5; }
    #response-area .entry .understood { color:#a7f3d0; }
    .task-list { gap:12px; }
    .task-item { align-items:flex-start; background:#18181b; border:1px solid #27272a; border-left-width:3px; border-radius:16px; padding:15px 16px; }
    .task-input .original { color:#f4f4f5; font-size:15px; }
    .task-input .interpreted { color:#a7f3d0; margin-top:7px; }
    .reframing { color:#d4af37; margin-top:7px; font-size:13px; }
    .loading-dots span { display:inline-block; animation:dotPulse 1.2s infinite; opacity:.25; }
    .loading-dots span:nth-child(2) { animation-delay:.2s; }
    .loading-dots span:nth-child(3) { animation-delay:.4s; }
    @keyframes dotPulse { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-2px)} }
    .task-id { min-width:62px; }
    .monitor-dialog { position:relative; background:#111; border:1px solid #4a3d16; border-radius:18px; padding:24px; width:min(620px,92vw); }
    .modal-close { position:absolute; top:14px; right:14px; width:38px; height:38px; border:1px solid #444; border-radius:50%; background:#1c1c1c; color:#fff; font-size:25px; line-height:1; cursor:pointer; }
    .modal-close:hover { background:#d4af37; border-color:#d4af37; color:#080808; }
    .monitor-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .monitor-grid label { color:#a3a3a3; font-size:12px; }
    .monitor-grid input,.monitor-grid select { width:100%; box-sizing:border-box; margin-top:5px; padding:10px; background:#191919; color:#fff; border:1px solid #383838; border-radius:9px; }
    #schedule-preview { max-height:130px; overflow:auto; color:#d4af37; margin:14px 0; font-size:13px; }
    @media (max-width:700px) { .sidebar{display:none}.container{margin-left:0;padding:18px 12px 130px}.task-item{flex-wrap:wrap}.task-id{display:none}.task-status{margin-left:auto}#response-area .entry{max-width:94%} }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">JARVIS</div>
  <button class="nav-btn active" onclick="clearAll()">＋ New Chat</button>
  <button class="nav-btn" onclick="document.getElementById('task-list').scrollIntoView()">Tasks</button>
  <button class="nav-btn" onclick="setCmd('list notes')">Notes</button>
  <button class="nav-btn" onclick="setCmd('open website google.com')">Browser</button>
  <button class="nav-btn" onclick="setCmd('open calculator')">Apps</button>
  <button class="nav-btn" onclick="openMonitoring()">Monitoring</button>
  <button class="nav-btn">Settings</button>
  <button class="nav-btn">History</button>
</aside>
<div class="container">
  <div class="card">
    <h1>🤖 Jarvis AI Command Center</h1>
    <button id="monitor-live" class="monitor-live hidden" type="button" onclick="openMonitoring()" aria-live="polite">
      <span class="monitor-orbit" aria-hidden="true"></span>
      <span id="monitor-live-text">Monitoring active</span>
    </button>
    <h2>Type a command or question. Enter to submit. Shift+Enter for new line.</h2>

    <textarea id="cmd" placeholder="Example: system status&#10;open calculator&#10;Who are you?"></textarea>

    <div class="controls">
      <select id="mode" class="mode-select">
        <option value="light">Light Mode</option>
        <option value="heavy">Heavy Mode</option>
      </select>
      <button class="btn btn-primary" id="execute-btn" onclick="submitCommand()">Execute</button>
      <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
      <button class="btn" id="voice-btn" onclick="toggleRecording()">🎙 Start Listening</button>
      <button class="btn btn-ghost btn-sm" onclick="clearCompleted()">Clear Completed</button>
      <button class="btn btn-ghost btn-sm" onclick="openMonitoring()">Start Monitoring</button>
    </div>
    <div id="voice-status"></div>
  </div>

  <div class="card">
    <h3>Response</h3>
    <div id="response-area">Waiting for command...</div>
  </div>

  <div class="card">
    <h3>Quick Commands</h3>
    <div class="quick-btns">
      <button onclick="setCmd('system status')">System Status</button>
      <button onclick="setCmd('take screenshot')">Take Screenshot</button>
      <button onclick="setCmd('open notepad')">Open Notepad</button>
      <button onclick="setCmd('open calculator')">Open Calculator</button>
      <button onclick="setCmd('open downloads')">Open Downloads</button>
      <button onclick="setCmd('open app paint')">Open Paint</button>
      <button onclick="setCmd('open website youtube.com')">Open YouTube</button>
      <button onclick="setCmd('google latest AI tools')">Google Search</button>
      <button onclick="setCmd('create note Continue Jarvis setup')">Create Note</button>
      <button onclick="setCmd('list notes')">List Notes</button>
      <button onclick="setCmd('list models')">List Models</button>
      <button onclick="setCmd('Who are you?')">Ask Jarvis</button>
    </div>
  </div>

  <div class="card">
    <h3>Task Queue</h3>
    <div id="task-list" class="task-list">
      <div style="color:#64748b; font-size:13px; text-align:center; padding:20px;">No tasks yet.</div>
    </div>
  </div>
</div>

<div id="monitor-overlay" class="confirm-overlay hidden">
  <div class="monitor-dialog">
    <button class="modal-close" type="button" aria-label="Close activity monitoring" onclick="closeMonitoring()">&times;</button>
    <h1>Activity Monitoring</h1>
    <div class="monitor-grid">
      <label>Start time<input id="monitor-start" type="time" value="09:00"></label>
      <label>End time<input id="monitor-end" type="time" value="18:30"></label>
      <label>Interval<select id="monitor-interval"><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">60 minutes</option></select></label>
      <label>Sound<select id="monitor-sound"><option value="soft">Soft beep</option><option value="double">Double beep</option><option value="alert">Alert chime</option><option value="gentle">Gentle bell</option></select></label>
    </div>
    <div id="schedule-preview"></div>
    <div class="controls">
      <button class="btn" onclick="previewSound()">Preview sound</button>
      <button class="btn btn-primary" onclick="startMonitoring()">Start</button>
      <button class="btn" onclick="monitorControl('pause')">Pause</button>
      <button class="btn" onclick="monitorControl('resume')">Resume</button>
      <button class="btn" onclick="monitorControl('stop')">Stop</button>
      <button class="btn" onclick="closeMonitoring()">Close</button>
    </div>
    <div id="monitor-status"></div>
  </div>
</div>

<!-- Confirmation Dialog -->
<div id="confirm-overlay" class="confirm-overlay hidden">
  <div class="confirm-dialog">
    <h3>⚠️ Confirmation Required</h3>
    <p id="confirm-message">This action requires your confirmation.</p>
    <div class="actions">
      <button class="btn btn-ghost" onclick="rejectTask()">Cancel</button>
      <button class="btn btn-warning" onclick="confirmTask()">Confirm</button>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let pendingConfirmTaskId = null;
let pollInterval = null;
let isSubmitting = false;

// ── Textarea: Enter submits, Shift+Enter newline ─────────────────────────────
document.getElementById("cmd").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    submitCommand();
  }
});

// ── Core: Submit command(s) ──────────────────────────────────────────────────
async function submitCommand() {
  if (isSubmitting) return;
  const text = document.getElementById("cmd").value;
  if (!text.trim()) {
    showResponse("Please enter a command or question.");
    return;
  }

  isSubmitting = true;
  document.getElementById("execute-btn").disabled = true;

  try {
    // Submit via the new task API
    const res = await fetch("/tasks/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });
    const data = await res.json();

    if (data.status === "ok") {
      // Show results — one entry per result line
      let html = "";
      // Split original text into lines to match each result to its line
      const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
      for (let i = 0; i < data.results.length; i++) {
        const r = data.results[i];
        const lineText = i < lines.length ? lines[i] : text;
        if (r.action === "chat") {
          // Route to AI chat
          html += `<div class="entry">
            <div class="label">You said:</div>
            <div class="original">${escapeHtml(lineText)}</div>
            <div class="label">Jarvis reframed:</div>
            <div class="understood">Conversational question — routing to AI chat</div>
          </div>`;
          // Fire AI chat
          const mode = document.getElementById("mode").value;
          const chatRes = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: lineText, mode: mode })
          });
          const chatData = await chatRes.json();
          html += `<div class="entry">
            <div class="label">Jarvis:</div>
            <div class="reply">${escapeHtml(chatData.reply || chatData.message || "No response")}</div>
          </div>`;
        } else if (r.action === "blocked") {
          html += `<div class="entry">
            <div class="label">You said:</div>
            <div class="original">${escapeHtml(lineText)}</div>
            <div class="label">Jarvis reframed:</div>
            <div class="understood">${escapeHtml(r.message)}</div>
            <div class="error">⛔ This action is blocked for safety.</div>
          </div>`;
        } else if (r.action === "created") {
          html += `<div class="entry">
            <div class="label">You said:</div>
            <div class="original">${escapeHtml(lineText)}</div>
            <div class="label">Jarvis reframed:</div>
            <div class="understood">${escapeHtml(r.message)}</div>
          </div>`;
          if (r.status === "waiting_for_confirmation") {
            pendingConfirmTaskId = r.task_id;
            showConfirmDialog(r.message);
          }
        } else {
          html += `<div class="entry">
            <div class="label">You said:</div>
            <div class="original">${escapeHtml(lineText)}</div>
            <div class="label">Jarvis reframed:</div>
            <div class="understood">${escapeHtml(r.message)}</div>
          </div>`;
        }
      }
      showResponse(html);
      document.getElementById("cmd").value = "";
    } else {
      showResponse(`Error: ${escapeHtml(data.message || "Unknown error")}`);
    }

    // Refresh task list
    refreshTasks();
  } catch (err) {
    showResponse(`Error: ${escapeHtml(err.message || err)}`);
  } finally {
    isSubmitting = false;
    document.getElementById("execute-btn").disabled = false;
  }
}

// ── Task List ────────────────────────────────────────────────────────────────
async function refreshTasks() {
  try {
    const res = await fetch("/tasks");
    const data = await res.json();
    if (data.status !== "ok") return;
    renderTasks(data.tasks || []);
  } catch (e) {
    // Silently fail — poll will retry
  }
}

function renderTasks(tasks) {
  const container = document.getElementById("task-list");
  if (!tasks.length) {
    container.innerHTML = '<div style="color:#64748b; font-size:13px; text-align:center; padding:20px;">No tasks yet.</div>';
    return;
  }

  let html = "";
  for (const t of tasks) {
    const statusClass = t.status.replace(/_/g, "_");
    const statusLabel = t.status.replace(/_/g, " ").toUpperCase();
    const isTerminal = ["completed", "partially_completed", "failed", "cancelled"].includes(t.status);
    const isWaiting = t.status === "waiting_for_confirmation";
    const isReframing = ["queued", "interpreting", "running"].includes(t.status);

    html += `<div class="task-item ${statusClass}">
      <div class="task-id">${escapeHtml(t.task_id.slice(0, 8))}</div>
      <div class="task-input">
        <div class="original"><span class="label">You said:</span> ${escapeHtml(t.original_input)}</div>
        ${isReframing
          ? `<div class="reframing">Jarvis is reframing<span class="loading-dots" aria-label="loading"><span>.</span><span>.</span><span>.</span></span></div>`
          : (t.interpreted_command ? `<div class="interpreted"><span class="label">Jarvis reframed:</span> ${escapeHtml(t.interpreted_command)}</div>` : "")}
        ${t.error ? `<div class="task-result" style="color:#f87171;">Error: ${escapeHtml(t.error)}</div>` : ""}
        ${t.result_summary ? `<div class="task-result" style="color:#22c55e;">${escapeHtml(t.result_summary)}</div>` : ""}
        ${t.step_results && t.step_results.length > 0 ? `<div class="task-result">${t.step_results.map(sr => {
          const output = sr.output_summary ? ` → ${escapeHtml(sr.output_summary)}` : "";
          const err = sr.error ? ` <span style="color:#f87171;">Error: ${escapeHtml(sr.error)}</span>` : "";
          return `<div>${escapeHtml(sr.description)}${output}${err}</div>`;
        }).join("")}</div>` : ""}
      </div>
      <div class="task-status status-${statusClass}">${statusLabel}</div>
      <div class="task-actions">
        ${isWaiting ? `<button class="btn btn-success btn-sm" onclick="confirmTaskById('${t.task_id}')">✓</button>
          <button class="btn btn-danger btn-sm" onclick="cancelTask('${t.task_id}')">✗</button>` : ""}
        ${!isTerminal && !isWaiting ? `<button class="btn btn-danger btn-sm" onclick="cancelTask('${t.task_id}')">✕</button>` : ""}
      </div>
    </div>`;
  }
  container.innerHTML = html;
}

// ── Task Actions ─────────────────────────────────────────────────────────────
async function cancelTask(taskId) {
  try {
    await fetch(`/tasks/${taskId}/cancel`, { method: "POST" });
    refreshTasks();
  } catch (e) {
    showResponse(`Error cancelling task: ${escapeHtml(e.message)}`);
  }
}

async function confirmTaskById(taskId) {
  try {
    await fetch(`/tasks/${taskId}/confirm`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ confirm: true })
    });
    pendingConfirmTaskId = null;
    hideConfirmDialog();
    refreshTasks();
  } catch (e) {
    showResponse(`Error confirming task: ${escapeHtml(e.message)}`);
  }
}

async function clearCompleted() {
  try {
    await fetch("/tasks/clear-completed", { method: "POST" });
    refreshTasks();
  } catch (e) {
    showResponse(`Error: ${escapeHtml(e.message)}`);
  }
}

// ── Confirmation Dialog ──────────────────────────────────────────────────────
function showConfirmDialog(message) {
  document.getElementById("confirm-message").textContent = message;
  document.getElementById("confirm-overlay").classList.remove("hidden");
}

function hideConfirmDialog() {
  document.getElementById("confirm-overlay").classList.add("hidden");
  pendingConfirmTaskId = null;
}

async function confirmTask() {
  if (pendingConfirmTaskId) {
    await confirmTaskById(pendingConfirmTaskId);
  }
}

async function rejectTask() {
  if (pendingConfirmTaskId) {
    await cancelTask(pendingConfirmTaskId);
  }
  hideConfirmDialog();
}

// ── Response Display ─────────────────────────────────────────────────────────
function showResponse(html) {
  document.getElementById("response-area").innerHTML = html;
}

function escapeHtml(str) {
  if (!str) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ── Voice Input (Phase 4, preserved) ─────────────────────────────────────────
const MAX_DURATION_MS = 15000;
let mediaRecorder = null;
let audioChunks = [];
let recordingTimer = null;
let isRecording = false;
let isUploading = false;
let mediaStream = null;

function encodeWav(samples, sampleRate) {
  const numSamples = samples.length;
  const buffer = new ArrayBuffer(44 + numSamples * 2);
  const view = new DataView(buffer);
  function writeStr(off, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
  }
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + numSamples * 2, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, "data");
  view.setUint32(40, numSamples * 2, true);
  for (let i = 0; i < numSamples; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}

async function blobToWav(blob) {
  const arrayBuf = await blob.arrayBuffer();
  const audioCtx = new AudioContext({ sampleRate: 16000 });
  try {
    const decoded = await audioCtx.decodeAudioData(arrayBuf);
    const mono = decoded.numberOfChannels === 1
      ? decoded.getChannelData(0)
      : (() => {
          const left  = decoded.getChannelData(0);
          const right = decoded.getChannelData(1);
          const out   = new Float32Array(left.length);
          for (let i = 0; i < left.length; i++) out[i] = (left[i] + right[i]) / 2;
          return out;
        })();
    let final = mono;
    if (decoded.sampleRate !== 16000) {
      const ratio = decoded.sampleRate / 16000;
      const outLen = Math.round(mono.length / ratio);
      final = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) {
        final[i] = mono[Math.min(mono.length - 1, Math.round(i * ratio))];
      }
    }
    return encodeWav(final, 16000);
  } finally {
    audioCtx.close();
  }
}

async function startRecording() {
  if (isRecording || isUploading) return;
  document.getElementById("voice-status").textContent = "Microphone permission required";
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    document.getElementById("voice-status").textContent =
      err.name === "NotFoundError" ? "No microphone detected" : "Microphone permission denied";
    return;
  }
  audioChunks = [];
  const preferredTypes = [
    "audio/webm; codecs=opus", "audio/webm",
    "audio/ogg; codecs=opus", "audio/ogg", ""
  ];
  const chosenMime = preferredTypes.find(t => t === "" || MediaRecorder.isTypeSupported(t)) || "";
  try {
    mediaRecorder = chosenMime
      ? new MediaRecorder(mediaStream, { mimeType: chosenMime })
      : new MediaRecorder(mediaStream);
  } catch (err) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
    document.getElementById("voice-status").textContent = "Unsupported browser";
    return;
  }
  isRecording = true;
  const voiceBtn = document.getElementById("voice-btn");
  voiceBtn.textContent = "⏹ Stop Listening";
  voiceBtn.classList.add("recording");
  document.getElementById("voice-status").textContent = "Recording...";
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
    isRecording = false;
    voiceBtn.textContent = "🎙 Start Listening";
    voiceBtn.classList.remove("recording");
    if (audioChunks.length === 0) {
      document.getElementById("voice-status").textContent = "Recording too short";
      return;
    }
    isUploading = true;
    document.getElementById("voice-status").textContent = "Processing audio...";
    try {
      const rawBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      document.getElementById("voice-status").textContent = "Jarvis is transcribing locally...";
      const wavBlob = await blobToWav(rawBlob);
      const formData = new FormData();
      formData.append("audio", wavBlob, "recording.wav");
      const res = await fetch("/voice/transcribe", { method: "POST", body: formData });
      const data = await res.json();
      if (res.ok && data.text) {
        document.getElementById("cmd").value = data.text;
        document.getElementById("voice-status").textContent =
          `Transcription ready (${data.processing_seconds}s): "${data.text}"`;
        // Auto-execute safe voice commands
        submitCommand();
      } else {
        document.getElementById("voice-status").textContent =
          "Transcription failed: " + (data.detail || "unknown error");
      }
    } catch (err) {
      document.getElementById("voice-status").textContent = "Transcription failed: " + err;
    } finally {
      isUploading = false;
    }
  };
  mediaRecorder.start();
  recordingTimer = setTimeout(() => {
    document.getElementById("voice-status").textContent = "Maximum recording duration reached";
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  }, MAX_DURATION_MS);
}

function stopRecording() {
  if (recordingTimer) { clearTimeout(recordingTimer); recordingTimer = null; }
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
}

function toggleRecording() {
  if (isRecording) stopRecording();
  else startRecording();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function setCmd(text) {
  document.getElementById("cmd").value = text;
}

function clearAll() {
  document.getElementById("cmd").value = "";
  document.getElementById("response-area").innerHTML = "Waiting for command...";
}

// ── Polling ──────────────────────────────────────────────────────────────────
function monitoringValues() {
  return {start:document.getElementById("monitor-start").value, end:document.getElementById("monitor-end").value, interval:Number(document.getElementById("monitor-interval").value), sound:document.getElementById("monitor-sound").value};
}
function updateSchedulePreview() {
  const v=monitoringValues(); let current=new Date(`2000-01-01T${v.start}:00`); const end=new Date(`2000-01-01T${v.end}:00`), times=[];
  while ((current=new Date(current.getTime()+v.interval*60000))<=end) times.push(current.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
  document.getElementById("schedule-preview").textContent=times.length?`Reminders: ${times.join("  ·  ")}`:"Choose a valid time range.";
}
function openMonitoring(){document.getElementById("monitor-overlay").classList.remove("hidden");updateSchedulePreview();}
function closeMonitoring(){document.getElementById("monitor-overlay").classList.add("hidden");}
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeMonitoring();});
document.getElementById("monitor-overlay").addEventListener("click",event=>{if(event.target.id==="monitor-overlay")closeMonitoring();});
async function startMonitoring(){const res=await fetch("/monitoring/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(monitoringValues())});const data=await res.json();document.getElementById("monitor-status").textContent=res.ok?`Monitoring running. Next alert: ${data.monitoring.next_alert||"next scheduled workday"}`:(data.detail||"Could not start monitoring");await refreshMonitoringStatus();}
async function monitorControl(action){const res=await fetch(`/monitoring/control/${action}`,{method:"POST"});const data=await res.json();document.getElementById("monitor-status").textContent=data.monitoring?`Monitoring: ${data.monitoring.status}`:(data.message||data.status);await refreshMonitoringStatus();}
async function refreshMonitoringStatus(){
  try {
    const res=await fetch("/monitoring"), data=await res.json(), state=data.monitoring;
    if(!state)return;
    const badge=document.getElementById("monitor-live"), label=document.getElementById("monitor-live-text");
    if(state.status==="stopped"){badge.classList.add("hidden");badge.classList.remove("paused");return;}
    badge.classList.remove("hidden");badge.classList.toggle("paused",state.status==="paused");
    label.textContent=state.status==="paused"?"Monitoring paused":`Monitoring active · Next ${state.next_alert||"scheduled time"}`;
  } catch(e) { /* next poll retries */ }
}
function previewSound(){const context=new (window.AudioContext||window.webkitAudioContext)(), sound=document.getElementById("monitor-sound").value;const patterns={soft:[[700,0,.9]],double:[[850,0,.35],[850,.5,.35]],alert:[[1050,0,.5],[800,.55,.5],[1050,1.1,.5]],gentle:[[550,0,.65],[700,.72,.65]]};for(const [frequency,offset,duration] of patterns[sound]){const oscillator=context.createOscillator(),gain=context.createGain();oscillator.frequency.value=frequency;gain.gain.value=.08;oscillator.connect(gain);gain.connect(context.destination);oscillator.start(context.currentTime+offset);oscillator.stop(context.currentTime+offset+duration);}}
document.getElementById("monitor-start").addEventListener("change",updateSchedulePreview);
document.getElementById("monitor-end").addEventListener("change",updateSchedulePreview);
document.getElementById("monitor-interval").addEventListener("change",updateSchedulePreview);

function startPolling() {
  refreshTasks();
  refreshMonitoringStatus();
  pollInterval = setInterval(()=>{refreshTasks();refreshMonitoringStatus();}, 2000);
}

function stopPolling() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
}

// Start polling when page loads
document.addEventListener("DOMContentLoaded", startPolling);
window.addEventListener("beforeunload", stopPolling);
</script>
