<!DOCTYPE html>
<html>
<head>
  <title>Jarvis Local Agent</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 30px;
    }
    .box {
      max-width: 1000px;
      margin: auto;
      background: #111827;
      padding: 25px;
      border-radius: 15px;
    }
    h1 {
      color: #38bdf8;
    }
    textarea {
      width: 100%;
      height: 130px;
      font-size: 18px;
      padding: 15px;
      border-radius: 10px;
      background: #020617;
      color: white;
      border: 1px solid #334155;
      box-sizing: border-box;
    }
    button, select {
      margin-top: 12px;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    #voice-btn {
      background: #16a34a;
      color: white;
      cursor: pointer;
    }
    #voice-btn.recording {
      background: #dc2626;
    }
    #voice-status {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 6px;
    }
    .quick button {
      background: #334155;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    pre {
      background: #020617;
      color: #22c55e;
      padding: 15px;
      border-radius: 10px;
      min-height: 180px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🤖 Jarvis Local Agent - Phase 2</h1>
    <p>Type your command below and click Execute.</p>

    <textarea id="cmd" placeholder="Example: system status"></textarea>

    <br>

    <select id="mode">
      <option value="light">Light Mode - Fast</option>
      <option value="heavy">Heavy Mode - Deep Thinking</option>
    </select>

    <button onclick="runCommand()">Execute</button>
    <button onclick="clearAll()">Clear</button>
    <button id="voice-btn" onclick="toggleRecording()">🎙 Start Listening</button>
    <div id="voice-status"></div>

    <div class="quick">
      <h3>Quick Commands</h3>
      <button onclick="setCmd('system status')">System Status</button>
      <button onclick="setCmd('take screenshot')">Take Screenshot</button>
      <button onclick="setCmd('open notepad')">Open Notepad</button>
      <button onclick="setCmd('open calculator')">Open Calculator</button>
      <button onclick="setCmd('open downloads')">Open Downloads</button>
      <button onclick="setCmd('open app paint')">Open Paint</button>
      <button onclick="setCmd('open website youtube.com')">Open YouTube</button>
      <button onclick="setCmd('google latest AI tools')">Google Search</button>
      <button onclick="setCmd('create note Continue Jarvis setup')">Create Note</button>
      <button onclick="setCmd('list notes')">List Notes</button>
      <button onclick="setCmd('list models')">List Models</button>
      <button onclick="setCmd('Who are you?')">Ask Jarvis</button>
    </div>

    <h3>Response</h3>
    <pre id="output">Waiting for command...</pre>
  </div>

<script>
function setCmd(text) {
  document.getElementById("cmd").value = text;
}

function clearAll() {
  document.getElementById("cmd").value = "";
  document.getElementById("output").textContent = "Waiting for command...";
}

async function runCommand() {
  const command = document.getElementById("cmd").value;
  const mode = document.getElementById("mode").value;
  const output = document.getElementById("output");

  if (!command.trim()) {
    output.textContent = "Please enter a command.";
    return;
  }

  output.textContent = "Jarvis working...";

  try {
    const res = await fetch("/agent", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        command: command,
        mode: mode
      })
    });

    const data = await res.json();
    output.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    output.textContent = "Error: " + err;
  }
}
// ── Voice Input (Phase 4) ──────────────────────────────────────────────────
const MAX_DURATION_MS = 15000;

let mediaRecorder = null;
let audioChunks = [];
let recordingTimer = null;
let isRecording = false;
let isUploading = false;
let mediaStream = null;

// Encode a Float32Array of mono audio samples as a 16-bit PCM WAV blob.
function encodeWav(samples, sampleRate) {
  const numSamples = samples.length;
  const buffer = new ArrayBuffer(44 + numSamples * 2);
  const view = new DataView(buffer);
  function writeStr(off, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
  }
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + numSamples * 2, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);       // PCM chunk size
  view.setUint16(20, 1, true);        // PCM format
  view.setUint16(22, 1, true);        // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);        // block align
  view.setUint16(34, 16, true);       // bits per sample
  writeStr(36, "data");
  view.setUint32(40, numSamples * 2, true);
  for (let i = 0; i < numSamples; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}

// Decode any recorded audio blob to mono 16 kHz WAV using AudioContext.
async function blobToWav(blob) {
  const arrayBuf = await blob.arrayBuffer();
  const audioCtx = new AudioContext({ sampleRate: 16000 });
  try {
    const decoded = await audioCtx.decodeAudioData(arrayBuf);
    // Mix down to mono
    const mono = decoded.numberOfChannels === 1
      ? decoded.getChannelData(0)
      : (() => {
          const left  = decoded.getChannelData(0);
          const right = decoded.getChannelData(1);
          const out   = new Float32Array(left.length);
          for (let i = 0; i < left.length; i++) out[i] = (left[i] + right[i]) / 2;
          return out;
        })();
    // Resample to 16 kHz if AudioContext gave a different rate
    let final = mono;
    if (decoded.sampleRate !== 16000) {
      const ratio = decoded.sampleRate / 16000;
      const outLen = Math.round(mono.length / ratio);
      final = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) {
        final[i] = mono[Math.min(mono.length - 1, Math.round(i * ratio))];
      }
    }
    return encodeWav(final, 16000);
  } finally {
    audioCtx.close();
  }
}

async function startRecording() {
  if (isRecording || isUploading) return;

  document.getElementById("voice-status").textContent = "Microphone permission required";

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
      document.getElementById("voice-status").textContent = "No microphone detected";
    } else {
      document.getElementById("voice-status").textContent = "Microphone permission denied";
    }
    return;
  }

  audioChunks = [];

  // Pick the best supported MIME type — prefer webm (Chrome/Edge), fall back to ogg (Firefox)
  const preferredTypes = [
    "audio/webm; codecs=opus",
    "audio/webm",
    "audio/ogg; codecs=opus",
    "audio/ogg",
    "",   // browser default
  ];
  const chosenMime = preferredTypes.find(t => t === "" || MediaRecorder.isTypeSupported(t)) || "";

  try {
    mediaRecorder = chosenMime
      ? new MediaRecorder(mediaStream, { mimeType: chosenMime })
      : new MediaRecorder(mediaStream);
  } catch (err) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
    document.getElementById("voice-status").textContent = "Unsupported browser";
    return;
  }

  isRecording = true;
  const voiceBtn = document.getElementById("voice-btn");
  voiceBtn.textContent = "⏹ Stop Listening";
  voiceBtn.classList.add("recording");
  document.getElementById("voice-status").textContent = "Recording...";

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    // Release microphone immediately
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }

    isRecording = false;
    voiceBtn.textContent = "🎙 Start Listening";
    voiceBtn.classList.remove("recording");

    if (audioChunks.length === 0) {
      document.getElementById("voice-status").textContent = "Recording too short";
      return;
    }

    isUploading = true;
    document.getElementById("voice-status").textContent = "Processing audio...";

    try {
      // Decode whatever format the browser produced and re-encode as 16 kHz mono WAV
      const rawBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      document.getElementById("voice-status").textContent = "Jarvis is transcribing locally...";
      const wavBlob = await blobToWav(rawBlob);

      const formData = new FormData();
      formData.append("audio", wavBlob, "recording.wav");

      const res = await fetch("/voice/transcribe", {
        method: "POST",
        body: formData,
      });
      const data = await res.json();
      if (res.ok && data.text) {
        document.getElementById("cmd").value = data.text;
        document.getElementById("voice-status").textContent =
          `Transcription ready (${data.processing_seconds}s): "${data.text}"`;
      } else {
        document.getElementById("voice-status").textContent =
          "Transcription failed: " + (data.detail || "unknown error");
      }
    } catch (err) {
      document.getElementById("voice-status").textContent = "Transcription failed: " + err;
    } finally {
      isUploading = false;
    }
  };

  mediaRecorder.start();

  // Auto-stop after 15 seconds
  recordingTimer = setTimeout(() => {
    document.getElementById("voice-status").textContent = "Maximum recording duration reached";
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
  }, MAX_DURATION_MS);
}

function stopRecording() {
  if (recordingTimer) {
    clearTimeout(recordingTimer);
    recordingTimer = null;
  }
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }
}

function toggleRecording() {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}
// ── End Voice Input ────────────────────────────────────────────────────────
</script>
</body>
</html>
